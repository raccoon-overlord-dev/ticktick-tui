# ticktick-tui theme: Zenbones Zenwritten Light (light)
# Colors from terminalcolors.com/themes/zenbones/zenwritten-light/, mapped onto ttui's roles
# by scripts/palettes.py (make palettes): don't edit, regenerate.
name = "zenbones"
family = "Zenbones"
variant = "Zenwritten Light"
mode = "light"
separator = "·"

[colors]
base      = "#eeeeee"
surface   = "#e7e7e7"
surface2  = "#d7d7d7"
line      = "#c9c9c9"
dim       = "#9b9b9b"
muted     = "#7b7b7b"
sub       = "#5a5a5a"
text      = "#353535"
accent    = "#944927"
secondary = "#88507d"
ok        = "#4f6c31"
info      = "#286486"
error     = "#a8334c"
warn      = "#944927"
p_high    = "#a8334c"
p_med     = "#944927"
p_low     = "#286486"
p_none    = "#9b9b9b"
