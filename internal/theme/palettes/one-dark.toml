# ticktick-tui theme: One Dark (dark)
# Colors from terminalcolors.com/themes/one/dark/, mapped onto ttui's roles
# by scripts/palettes.py (make palettes): don't edit, regenerate.
name = "one"
family = "One"
variant = ""
mode = "dark"
separator = "·"

[colors]
base      = "#282c34"
surface   = "#2d313a"
surface2  = "#3c4049"
line      = "#424750"
dim       = "#636873"
muted     = "#797f8a"
sub       = "#9197a3"
text      = "#abb2bf"
accent    = "#61afef"
secondary = "#c678dd"
ok        = "#98c379"
info      = "#61afef"
error     = "#e06c75"
warn      = "#d19a66"
p_high    = "#e06c75"
p_med     = "#d19a66"
p_low     = "#61afef"
p_none    = "#636873"
