# ticktick-tui theme: One Half Dark (dark)
# Colors from terminalcolors.com/themes/one-half/dark/, mapped onto ttui's roles
# by scripts/palettes.py (make palettes): don't edit, regenerate.
name = "one-half"
family = "One Half"
variant = ""
mode = "dark"
separator = "·"

[colors]
base      = "#282c34"
surface   = "#2f333b"
surface2  = "#474e5d"
line      = "#4c5057"
dim       = "#797d83"
muted     = "#989ba1"
sub       = "#b8bbc1"
text      = "#dcdfe4"
accent    = "#98c379"
secondary = "#c678dd"
ok        = "#98c379"
info      = "#61afef"
error     = "#e06c75"
warn      = "#e5c07b"
p_high    = "#e06c75"
p_med     = "#e5c07b"
p_low     = "#61afef"
p_none    = "#797d83"
